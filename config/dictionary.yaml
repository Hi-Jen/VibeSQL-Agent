domains:
  인사팀:
    synonyms:
      직원: "employees"
      사원: "employees"
      부서: "departments"
      이름: "name"
      급여: "salary"
      연봉: "salary"
      월급: "salary"
      입사일: "hire_date"
      부서명: "department_name"
      부서이름: "department_name"
      직급: "position"
      이메일: "email"

  공통:
    synonyms:
      전체: "*"
      모두: "*"
      평균: "AVG"
      합계: "SUM"
      최대: "MAX"
      최소: "MIN"
      개수: "COUNT"
