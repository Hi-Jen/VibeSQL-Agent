# VibeSQL-Agent Semantic Dictionary
# 부서별 용어 정의 및 메타데이터 관리

departments:
  marketing:
    terms:
      활성유저:
        description: "최근 30일 이내에 로그인한 유저"
        sql_condition: "last_login >= CURRENT_DATE - INTERVAL '30 days'"
      충성고객:
        description: "총 구매 금액이 100만원 이상인 유저"
        sql_condition: "total_spent >= 1000000"
    schemas:
      - users
      - orders
      - marketing_campaigns

  finance:
    terms:
      매출액:
        description: "환불을 제외한 순수 결제 금액"
        sql_calculation: "SUM(price - refund_amount)"
      영업이익:
        description: "매출액에서 매출원가를 뺀 금액"
        sql_calculation: "SUM(price - refund_amount - cost)"
    schemas:
      - transactions
      - products
      - settlements

global_rules:
  default_limit: 1000
  forbidden_keywords:
    - DROP
    - DELETE
    - UPDATE
    - TRUNCATE
    - ALTER
    - INSERT
